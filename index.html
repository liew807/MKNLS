<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IG Clone</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#fafafa; color:#262626; }
  .topbar { position:sticky; top:0; background:#fff; border-bottom:1px solid #dbdbdb; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; z-index:100; }
  .logo { font-size:22px; font-weight:700; font-style:italic; letter-spacing:-0.5px; }
  .topbar .right { display:flex; gap:16px; align-items:center; font-size:14px; }
  .topbar .right span { cursor:pointer; color:#0095f6; }
  .container { max-width:520px; margin:0 auto; padding:16px; }

  /* 登录 */
  .auth { background:#fff; border:1px solid #dbdbdb; border-radius:12px; padding:32px 24px; margin-top:60px; text-align:center; }
  .auth h1 { font-size:32px; font-style:italic; margin-bottom:24px; font-weight:700; }
  .auth input { width:100%; padding:12px; margin-bottom:10px; border:1px solid #dbdbdb; border-radius:8px; font-size:14px; background:#fafafa; }
  .auth button { width:100%; padding:12px; background:#0095f6; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:14px; margin-top:6px; }
  .auth button:disabled { opacity:0.5; }
  .auth .switch { margin-top:16px; font-size:13px; color:#0095f6; cursor:pointer; }

  /* 发布框 */
  .composer { background:#fff; border:1px solid #dbdbdb; border-radius:12px; padding:12px; margin-bottom:16px; }
  .composer textarea { width:100%; border:none; resize:none; font-size:14px; outline:none; font-family:inherit; min-height:44px; }
  .composer .row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .composer .file { font-size:13px; color:#0095f6; cursor:pointer; }
  .composer .btn { padding:8px 18px; background:#0095f6; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-size:13px; }
  .composer .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .preview { max-width:100%; max-height:200px; border-radius:8px; margin-top:8px; display:none; }

  /* 帖子 */
  .post { background:#fff; border:1px solid #dbdbdb; border-radius:12px; margin-bottom:16px; overflow:hidden; }
  .post .head { padding:12px; display:flex; align-items:center; gap:10px; }
  .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:14px; }
  .post .head .name { font-weight:600; font-size:14px; flex:1; cursor:pointer; }
  .post .head .follow { font-size:12px; color:#0095f6; cursor:pointer; font-weight:600; padding:4px 10px; border:1px solid #0095f6; border-radius:6px; background:#fff; }
  .post .head .follow.following { color:#262626; border-color:#dbdbdb; }
  .ad-badge { display:inline-block; background:#ffd700; color:#000; font-size:10px; padding:2px 6px; border-radius:4px; margin-left:6px; font-weight:700; vertical-align:middle; }
  .post .content { padding:0 12px 12px; font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .post .img { width:100%; display:block; }
  .post .actions { padding:10px 12px; border-top:1px solid #efefef; display:flex; gap:18px; font-size:14px; color:#8e8e8e; align-items:center; }
  .post .actions span { cursor:pointer; user-select:none; }
  .post .actions .liked { color:#ed4956; font-weight:600; }
  .post .actions .promote { margin-left:auto; color:#0095f6; font-size:12px; font-weight:600; }
  .post .actions .promote.on { color:#8e8e8e; }

  /* 广告统计面板 */
  .stats { background:#fff; border:1px solid #dbdbdb; border-radius:12px; padding:16px; margin-bottom:16px; display:none; }
  .stats h3 { font-size:15px; margin-bottom:12px; }
  .stats .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat { background:#fafafa; padding:10px; border-radius:8px; }
  .stat .l { font-size:11px; color:#8e8e8e; }
  .stat .v { font-size:18px; font-weight:700; margin-top:2px; }

  .empty { text-align:center; color:#8e8e8e; padding:48px 0; font-size:14px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#262626; color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; opacity:0; transition:opacity 0.3s; z-index:999; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">IG Clone</div>
  <div class="right" id="userArea"></div>
</div>

<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const API = '/api';
let token = localStorage.getItem('token');
let username = localStorage.getItem('username');
let currentTab = 'feed';

/* ---------- 工具 ---------- */
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function api(path, method = 'GET', body) {
  const r = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401) { localStorage.clear(); token = null; renderAuth(); throw new Error('未登录'); }
  return r.json();
}
function logout() { localStorage.clear(); token = null; renderAuth(); }

/* ---------- 登录 / 注册 ---------- */
function renderAuth() {
  document.getElementById('userArea').innerHTML = '';
  const app = document.getElementById('app');
  app.innerHTML = '';
  let mode = 'login';
  const box = el(`
    <div class="auth">
      <h1>IG Clone</h1>
      <input id="u" placeholder="用户名">
      <input id="p" type="password" placeholder="密码">
      <button id="submit">登录</button>
      <div class="switch" id="switch">没有账号？注册</div>
    </div>
  `);
  app.appendChild(box);

  box.querySelector('#switch').onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    box.querySelector('#submit').textContent = mode === 'login' ? '登录' : '注册';
    box.querySelector('#switch').textContent = mode === 'login' ? '没有账号？注册' : '已有账号？登录';
  };

  box.querySelector('#submit').onclick = async () => {
    const u = box.querySelector('#u').value.trim();
    const p = box.querySelector('#p').value;
    if (!u || !p) return toast('请填写完整');
    const btn = box.querySelector('#submit');
    btn.disabled = true;
    try {
      if (mode === 'register') {
        const r = await fetch(API + '/register', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ username:u, password:p })
        });
        const d = await r.json();
        if (d.error) { toast(d.error); btn.disabled = false; return; }
      }
      const r = await fetch(API + '/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username:u, password:p })
      });
      const d = await r.json();
      if (d.error) { toast(d.error); btn.disabled = false; return; }
      localStorage.setItem('token', d.token);
      localStorage.setItem('username', d.username);
      token = d.token; username = d.username;
      renderApp();
    } catch { btn.disabled = false; toast('网络错误'); }
  };
}

/* ---------- 主应用 ---------- */
async function renderApp() {
  document.getElementById('userArea').innerHTML = `
    <span onclick="switchTab('feed')">首页</span>
    <span onclick="switchTab('stats')">广告数据</span>
    <span style="color:#262626;cursor:default;">@${username}</span>
    <span onclick="logout()" style="color:#8e8e8e;">退出</span>
  `;
  currentTab === 'stats' ? await renderStats() : await renderFeed();
}

function switchTab(tab) {
  currentTab = tab;
  renderApp();
}

/* ---------- Feed ---------- */
async function renderFeed() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="composer">
      <textarea id="content" placeholder="分享点什么..."></textarea>
      <input type="file" id="file" accept="image/*" style="display:none;">
      <img id="preview" class="preview">
      <div class="row">
        <span class="file" onclick="document.getElementById('file').click()">📷 添加图片</span>
        <button class="btn" id="publish">发布</button>
      </div>
    </div>
    <div id="posts"></div>
  `;

  let imageData = '';
  app.querySelector('#file').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      imageData = ev.target.result;
      const pv = app.querySelector('#preview');
      pv.src = imageData; pv.style.display = 'block';
    };
    reader.readAsDataURL(f);
  };

  app.querySelector('#publish').onclick = async () => {
    const content = app.querySelector('#content').value.trim();
    if (!content && !imageData) return toast('内容不能为空');
    const btn = app.querySelector('#publish');
    btn.disabled = true;
    try {
      await api('/posts', 'POST', { content, image: imageData });
      toast('发布成功');
      renderFeed();
    } catch { btn.disabled = false; }
  };

  const posts = await api('/posts');
  const list = document.getElementById('posts');
  list.innerHTML = '';
  if (!posts.length) {
    list.innerHTML = '<div class="empty">还没有帖子，发一条试试</div>';
    return;
  }
  posts.forEach(p => list.appendChild(renderPost(p)));
}

function renderPost(p) {
  const isMe = p.username === username;
  const node = el(`
    <div class="post" data-id="${p.id}">
      <div class="head">
        <div class="avatar">${escapeHtml(p.username[0].toUpperCase())}</div>
        <div class="name" onclick="viewUser(${p.user_id})">
          ${escapeHtml(p.username)}
          ${p.is_ad ? '<span class="ad-badge">广告</span>' : ''}
        </div>
        ${!isMe ? `<button class="follow ${p.following ? 'following' : ''}">${p.following ? '已关注' : '关注'}</button>` : ''}
      </div>
      ${p.content ? `<div class="content">${escapeHtml(p.content)}</div>` : ''}
      ${p.image ? `<img class="img" src="${p.image}">` : ''}
      <div class="actions">
        <span class="like ${p.liked ? 'liked' : ''}">${p.liked ? '❤' : '🤍'} ${p.likes_count}</span>
        <span class="views">👁 ${p.views}</span>
        ${isMe ? `<span class="promote ${p.is_ad ? 'on' : ''}">${p.is_ad ? '取消投放' : '投放广告'}</span>` : ''}
      </div>
    </div>
  `);

  node.querySelector('.like').onclick = async (e) => {
    const d = await api(`/posts/${p.id}/like`, 'POST');
    const span = e.currentTarget;
    span.textContent = (d.liked ? '❤ ' : '🤍 ') + d.likes_count;
    span.classList.toggle('liked', d.liked);
  };

  const followBtn = node.querySelector('.follow');
  if (followBtn) {
    followBtn.onclick = async () => {
      const d = await api(`/follow/${p.user_id}`, 'POST');
      followBtn.textContent = d.following ? '已关注' : '关注';
      followBtn.classList.toggle('following', d.following);
      toast(d.following ? '已关注' : '已取消关注');
    };
  }

  const promoteBtn = node.querySelector('.promote');
  if (promoteBtn) {
    promoteBtn.onclick = async () => {
      if (p.is_ad) {
        await api(`/posts/${p.id}/unpromote`, 'POST');
        toast('已取消投放');
      } else {
        const budget = prompt('广告预算（美元）', '5');
        if (!budget) return;
        await api(`/posts/${p.id}/promote`, 'POST', { budget: Number(budget) });
        toast('广告已投放');
      }
      renderFeed();
    };
  }

  // 浏览量 +1（同一个帖子本次会话只加一次）
  const key = 'viewed_' + p.id;
  if (!sessionStorage.getItem(key)) {
    sessionStorage.setItem(key, '1');
    api(`/posts/${p.id}/view`, 'POST').then(d => {
      const v = node.querySelector('.views');
      if (v) v.textContent = '👁 ' + d.views;
    });
  }

  return node;
}

/* ---------- 用户主页 ---------- */
async function viewUser(userId) {
  const posts = await api(`/users/${userId}/posts`);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="margin-bottom:12px;">
      <span style="color:#0095f6;cursor:pointer;" onclick="renderApp()">← 返回首页</span>
    </div>
    <div id="userposts"></div>
  `;
  const list = document.getElementById('userposts');
  if (!posts.length) {
    list.innerHTML = '<div class="empty">这个用户还没有帖子</div>';
    return;
  }
  posts.forEach(p => list.appendChild(renderPost(p)));
}

/* ---------- 广告数据面板 ---------- */
async function renderStats() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="empty">加载中...</div>';
  const data = await api('/ads/stats');
  const s = data.summary;
  app.innerHTML = `
    <div class="stats" style="display:block;">
      <h3>📊 我的广告数据</h3>
      <div class="grid">
        <div class="stat"><div class="l">投放中广告</div><div class="v">${s.count}</div></div>
        <div class="stat"><div class="l">总花费</div><div class="v">$${s.totalBudget.toFixed(2)}</div></div>
        <div class="stat"><div class="l">总浏览量</div><div class="v">${s.totalViews}</div></div>
        <div class="stat"><div class="l">总点赞</div><div class="v">${s.totalLikes}</div></div>
        <div class="stat"><div class="l">CPM（千次展示成本）</div><div class="v">$${s.cpm}</div></div>
        <div class="stat"><div class="l">CPL（单次点赞成本）</div><div class="v">$${s.cpl}</div></div>
      </div>
    </div>
    <h3 style="font-size:15px;margin-bottom:12px;">广告明细</h3>
    <div id="adlist"></div>
  `;
  const list = document.getElementById('adlist');
  if (!data.ads.length) {
    list.innerHTML = '<div class="empty">还没有投放广告</div>';
    return;
  }
  data.ads.forEach(a => {
    list.appendChild(el(`
      <div class="post">
        <div class="content" style="padding:12px;">${escapeHtml(a.content || '(图片广告)')}</div>
        <div class="actions">
          <span>👁 ${a.views}</span>
          <span>❤ ${a.likes_count}</span>
          <span style="margin-left:auto;color:#0095f6;">预算 $${a.ad_budget}</span>
        </div>
      </div>
    `));
  });
}

/* ---------- 启动 ---------- */
if (token) renderApp();
else renderAuth();
</script>
</body>
</html>
